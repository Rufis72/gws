[project]
name = "gws"
version = "0.1.0"
description = ""
authors = [
    {name = "Rufis72",email = "milo.games.silverstein@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyautogui (>=0.9.54,<0.10.0)",
    "typing-extensions (>=4.15.0,<5.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "requests (>=2.34.2,<3.0.0)",
]

[tool.poetry]
packages = [{include = "gws", from = "src"}]

[tool.poetry.dependencies]
wayland-automation = {version = ">=0.2.8,<0.3.0", markers = "sys_platform == 'linux' or sys_platform == 'linux2'"}
pyobjc = {version = ">=12.2.1,<13.0.0", markers = "sys_platform == 'darwin'"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
